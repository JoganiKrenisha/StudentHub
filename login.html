<!DOCTYPE html>
<html>

<head>

    <title>StudentHub Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">

            <img src="aca.png" width="50" height="50">

            <h2>STUDENTHUB</h2>

        </div>

    </header>


    <!-- Login Form -->

    <main class="home-main">

        <h2 class="portal-name">
            Student Login
        </h2>


        <form action="dashboard.html">


            <label>
                <b>Email</b>
            </label>

            <br><br>


            <input 
            type="email"
            placeholder="Enter Email"
            required>


            <br><br>


            <label>
                <b>Password</b>
            </label>

            <br><br>


            <input 
            type="password"
            placeholder="Enter Password"
            required>


            <br><br>


            <input 
            type="submit"
            value="Login"
            class="open-btn">


        </form>


        <br>


        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


    </main>


    <!-- Footer -->

    <div class="footer">

        <p>
            © 2026 StudentHub. All Rights Reserved.
        </p>

    </div>


</body>

</html>
