<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="register-header">

        <div class="logo">
            <img src="aca.png" width="50" height="50" alt="Logo">
            <h2>STUDENTHUB</h2>
        </div>

    </header>

    <!-- Registration Form -->
    <main class="register-main">

        <h2 class="register-title">
            Registration Form
        </h2>

        <form action="login.html">

            <label><b>Select User Type</b></label><br><br>

            <select class="register-input">
                <option>Student</option>
                <option>Admin</option>
            </select>

            <br><br>

            <label><b>Full Name</b></label><br><br>

            <input type="text"
                   placeholder="Enter Full Name"
                   class="register-input">

            <br><br>

            <label><b>Email</b></label><br><br>

            <input type="email"
                   placeholder="Enter Email"
                   class="register-input">

            <br><br>

            <label><b>Password</b></label><br><br>

            <input type="password"
                   placeholder="Enter Password"
                   class="register-input">

            <br><br>

            <label><b>Confirm Password</b></label><br><br>

            <input type="password"
                   placeholder="Confirm Password"
                   class="register-input">

            <br><br>

            <input type="submit"
                   value="Register"
                   class="register-btn2">

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html" class="login-link">
                Login
            </a>
        </p>

    </main>

    <div class="footer">
        <p>© 2026 StudentHub. All Rights Reserved.</p>
    </div>

</body>

</html>
